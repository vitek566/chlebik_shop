<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog | Clebikshop</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --color-primary: #4f46e5;
      --color-primary-hover: #4338ca;
      --color-danger: #ef4444;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      --radius-sm: 8px;
      --radius-md: 12px;
      --transition-fast: 0.2s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg-page); color: var(--text-main); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    
    .hidden { display: none !important; }
    .w-full { width: 100%; }
    
    .site-header { position: sticky; top: 0; z-index: 50; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 20px 0; margin-bottom: 40px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .brand { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.025em; }
    .brand span { color: var(--color-primary); }
    
    .toolbar { display: flex; flex-direction: column; gap: 16px; }
    @media(min-width: 768px) { .toolbar { flex-direction: row; justify-content: space-between; align-items: center; } }
    
    .search-input { width: 100%; max-width: 400px; padding: 12px 20px; background: var(--bg-page); border: 1px solid var(--border); border-radius: 999px; font-size: 0.95rem; outline: none; transition: var(--transition-fast); }
    .search-input:focus { border-color: var(--color-primary); background: #fff; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
    
    .filter-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-filter { padding: 8px 20px; border-radius: 999px; background: #fff; border: 1px solid var(--border); color: var(--text-muted); font-weight: 500; cursor: pointer; transition: var(--transition-fast); }
    .btn-filter:hover { border-color: var(--text-muted); }
    .btn-filter.active { background: var(--text-main); color: #fff; border-color: var(--text-main); }

    button { font-family: inherit; cursor: pointer; outline: none; display: inline-flex; justify-content: center; align-items: center; gap: 8px; transition: var(--transition-fast); }
    .btn-auth { background: transparent; border: 1px solid var(--border); padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: 0.9rem; }
    .btn-auth:hover { background: var(--bg-page); }
    .btn-primary { background: var(--color-primary); color: #fff; border: none; padding: 12px 24px; border-radius: var(--radius-sm); font-weight: 600; }
    .btn-primary:hover:not(:disabled) { background: var(--color-primary-hover); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
    .btn-secondary { background: #f1f5f9; color: var(--text-main); border: none; padding: 12px 24px; border-radius: var(--radius-sm); font-weight: 600; }
    .btn-secondary:hover { background: #e2e8f0; }

    .admin-zone { background: var(--bg-card); padding: 30px; border-radius: var(--radius-md); box-shadow: var(--shadow-md); border-top: 4px solid var(--color-primary); margin-bottom: 40px; }
    .admin-zone-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .admin-zone-header h2 { font-size: 1.25rem; font-weight: 700; }
    .btn-text-danger { background: none; border: none; color: var(--color-danger); font-weight: 600; }
    .btn-text-danger:hover { text-decoration: underline; }

    .form-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 20px; }
    @media(min-width: 768px) { .form-grid { grid-template-columns: 1fr 1fr; } }
    .input-field { display: flex; flex-direction: column; gap: 6px; }
    .input-field label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
    .input-field input, .input-field select, .input-field textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-page); font-family: inherit; font-size: 0.95rem; outline: none; transition: var(--transition-fast); }
    .input-field input:focus, .input-field select:focus, .input-field textarea:focus { border-color: var(--color-primary); background: #fff; }

    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; padding-bottom: 80px; }
    .product-card { background: var(--bg-card); border-radius: var(--radius-md); border: 1px solid var(--border); box-shadow: var(--shadow-sm); overflow: hidden; display: flex; flex-direction: column; transition: transform 0.3s ease, box-shadow 0.3s ease; }
    .product-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
    
    .product-image { position: relative; width: 100%; aspect-ratio: 4/3; background: #f1f5f9; overflow: hidden; }
    .product-image img { width: 100%; height: 100%; object-fit: cover; }
    .badge { position: absolute; top: 12px; left: 12px; background: rgba(255,255,255,0.95); padding: 4px 12px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    
    .product-info { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
    .product-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 8px; color: var(--text-main); }
    .product-desc { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 16px; flex-grow: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .product-price { font-size: 1.35rem; font-weight: 800; color: var(--color-primary); }
    
    .product-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px 20px; }
    .btn-edit { background: var(--bg-page); border: none; padding: 10px; border-radius: var(--radius-sm); font-weight: 600; color: var(--text-main); }
    .btn-edit:hover { background: #e2e8f0; }
    .btn-delete { background: #fef2f2; border: none; padding: 10px; border-radius: var(--radius-sm); font-weight: 600; color: var(--color-danger); }
    .btn-delete:hover { background: #fee2e2; }

    .modal-overlay { position: fixed; inset: 0; z-index: 100; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .modal-backdrop { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
    .modal-box { position: relative; background: var(--bg-card); width: 100%; max-width: 500px; padding: 30px; border-radius: var(--radius-md); box-shadow: var(--shadow-lg); animation: slideUp 0.3s ease-out; }
    .modal-box h3 { font-size: 1.5rem; font-weight: 700; margin-bottom: 20px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 25px; }
    
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .status-message { text-align: center; padding: 40px; color: var(--text-muted); font-size: 1.1rem; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <div class="header-top">
        <div class="brand">Clebikshop<span>.</span></div>
        <button id="ui-btn-auth" class="btn-auth">🔐 Prodejce</button>
      </div>

      <div class="toolbar">
        <input type="text" id="ui-search" class="search-input" placeholder="Hledat v katalogu...">
        <div class="filter-group" id="ui-filters">
          <button class="btn-filter active" data-category="all">Vše</button>
          <button class="btn-filter" data-category="potraviny">Potraviny</button>
          <button class="btn-filter" data-category="rybarske">Rybářské potřeby</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    
    <section id="ui-admin-zone" class="admin-zone hidden">
      <div class="admin-zone-header">
        <h2>Přidat nový produkt</h2>
        <button id="ui-btn-logout" class="btn-text-danger">Odhlásit se</button>
      </div>
      
      <form id="form-add-product">
        <div class="form-grid">
          <div class="input-field">
            <label>Název produktu</label>
            <input type="text" id="add-title" required placeholder="Např. Kvalitní naviják">
          </div>
          <div class="input-field">
            <label>Cena (s měnou)</label>
            <input type="text" id="add-price" placeholder="Např. 1200 Kč">
          </div>
          <div class="input-field">
            <label>Kategorie</label>
            <select id="add-category" required>
              <option value="" disabled selected>Zvolte kategorii...</option>
              <option value="potraviny">Potraviny</option>
              <option value="rybarske">Rybářské potřeby</option>
            </select>
          </div>
          <div class="input-field">
            <label>Odkaz na fotku (URL adresa)</label>
            <input type="url" id="add-image" required placeholder="https://priklad.cz/foto.jpg">
          </div>
        </div>
        <div class="input-field" style="margin-bottom: 20px;">
          <label>Popis produktu</label>
          <textarea id="add-desc" rows="3" required placeholder="Detailní popis..."></textarea>
        </div>
        <button type="submit" id="btn-save-new" class="btn-primary w-full">Přidat do databáze</button>
      </form>
    </section>

    <div id="ui-products-grid" class="products-grid">
      <div class="status-message">Načítám připojení k serveru...</div>
    </div>

  </main>

  <div id="modal-login" class="modal-overlay hidden">
    <div class="modal-backdrop" id="backdrop-login"></div>
    <div class="modal-box">
      <h3>Autorizace prodejce</h3>
      <div class="input-field">
        <label>Zadejte administrátorské heslo</label>
        <input type="password" id="input-password" placeholder="••••••••">
      </div>
      <div class="modal-actions">
        <button type="button" id="btn-login-cancel" class="btn-secondary">Zrušit</button>
        <button type="button" id="btn-login-confirm" class="btn-primary">Přihlásit se</button>
      </div>
    </div>
  </div>

  <div id="modal-edit" class="modal-overlay hidden">
    <div class="modal-backdrop" id="backdrop-edit"></div>
    <div class="modal-box">
      <h3>Úprava produktu</h3>
      <form id="form-edit-product">
        <input type="hidden" id="edit-id">
        
        <div class="form-grid">
          <div class="input-field"><label>Název</label><input type="text" id="edit-title" required></div>
          <div class="input-field"><label>Cena</label><input type="text" id="edit-price"></div>
          <div class="input-field">
            <label>Kategorie</label>
            <select id="edit-category" required>
              <option value="potraviny">Potraviny</option>
              <option value="rybarske">Rybářské potřeby</option>
            </select>
          </div>
          <div class="input-field"><label>Odkaz na fotku (URL)</label><input type="url" id="edit-image" required></div>
        </div>
        <div class="input-field" style="margin-bottom: 20px;"><label>Popis</label><textarea id="edit-desc" rows="3" required></textarea></div>
        
        <div class="modal-actions">
          <button type="button" id="btn-edit-cancel" class="btn-secondary">Zrušit</button>
          <button type="submit" id="btn-save-edit" class="btn-primary">Uložit změny</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const SYSTEM_PASSWORD = "chlebakk";
    const STATE = {
      isAdmin: false,
      products: [],
      currentCategory: 'all',
      searchQuery: ''
    };

    const DOM = {
      btnAuth: document.getElementById('ui-btn-auth'),
      adminZone: document.getElementById('ui-admin-zone'),
      btnLogout: document.getElementById('ui-btn-logout'),
      productsGrid: document.getElementById('ui-products-grid'),
      filtersWrap: document.getElementById('ui-filters'),
      searchInput: document.getElementById('ui-search'),
      modalLogin: document.getElementById('modal-login'),
      modalEdit: document.getElementById('modal-edit'),
      btnLoginConfirm: document.getElementById('btn-login-confirm'),
      btnLoginCancel: document.getElementById('btn-login-cancel'),
      btnEditCancel: document.getElementById('btn-edit-cancel'),
      inputPassword: document.getElementById('input-password'),
      formAdd: document.getElementById('form-add-product'),
      formEdit: document.getElementById('form-edit-product')
    };

    const firebaseConfig = {
      apiKey: "AIzaSyA2yXEzcYQYsHOoIhARz7uqo3LJSrLVNUs",
      authDomain: "clebikshop.firebaseapp.com",
      projectId: "clebikshop",
      storageBucket: "clebikshop.firebasestorage.app",
      messagingSenderId: "129581121422",
      appId: "1:129581121422:web:a362d35549d02b5a11eedf"
    };

    let db;

    function renderProducts() {
      let dataToRender = STATE.products;
      
      if (STATE.currentCategory !== 'all') {
        dataToRender = dataToRender.filter(p => p.category === STATE.currentCategory);
      }
      
      if (STATE.searchQuery !== '') {
        const query = STATE.searchQuery.toLowerCase();
        dataToRender = dataToRender.filter(p => 
          p.title.toLowerCase().includes(query) || 
          p.description.toLowerCase().includes(query)
        );
      }

      if (dataToRender.length === 0) {
        DOM.productsGrid.innerHTML = '<div class="status-message">Žádné produkty neodpovídají hledání.</div>';
        return;
      }

      const htmlBlocks = dataToRender.map(product => {
        const adminButtons = STATE.isAdmin ? `
          <div class="product-actions">
            <button class="btn-edit js-edit-btn" data-id="${product.id}">Upravit</button>
            <button class="btn-delete js-del-btn" data-id="${product.id}">Smazat</button>
          </div>
        ` : '';

        return `
          <div class="product-card">
            <div class="product-image">
              <span class="badge">${product.category === 'potraviny' ? 'Potraviny' : 'Rybářské'}</span>
              <img src="${product.image_url}" alt="Foto produktu" loading="lazy" onerror="this.src='https://via.placeholder.com/400x300?text=Chyba+obrázku'">
            </div>
            <div class="product-info">
              <h3 class="product-title">${product.title}</h3>
              <p class="product-desc">${product.description}</p>
              <div class="product-price">${product.price || 'Cena na dotaz'}</div>
            </div>
            ${adminButtons}
          </div>
        `;
      });

      DOM.productsGrid.innerHTML = htmlBlocks.join('');
    }

    function updateSystemUI() {
      if (STATE.isAdmin) {
        DOM.adminZone.classList.remove('hidden');
        DOM.btnAuth.innerHTML = '🔓 Odhlásit se';
      } else {
        DOM.adminZone.classList.add('hidden');
        DOM.btnAuth.innerHTML = '🔐 Prodejce';
      }
      renderProducts();
    }

    async function loadDatabase() {
      try {
        DOM.productsGrid.innerHTML = '<div class="status-message">Načítám produkty...</div>';
        const q = query(collection(db, "products"), orderBy("created_at", "desc"));
        const snapshot = await getDocs(q);
        
        STATE.products = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));
        
        renderProducts();
      } catch (error) {
        console.error(error);
        DOM.productsGrid.innerHTML = '<div class="status-message" style="color:red;">Chyba: Nepodařilo se načíst databázi. Zkontrolujte připojení.</div>';
      }
    }

    function initializeEvents() {
      DOM.btnAuth.addEventListener('click', () => {
        if (STATE.isAdmin) {
          STATE.isAdmin = false;
          updateSystemUI();
        } else {
          DOM.modalLogin.classList.remove('hidden');
        }
      });

      const closeLogin = () => { DOM.modalLogin.classList.add('hidden'); DOM.inputPassword.value = ''; };
      DOM.btnLoginCancel.addEventListener('click', closeLogin);
      document.getElementById('backdrop-login').addEventListener('click', closeLogin);

      const closeEdit = () => { DOM.modalEdit.classList.add('hidden'); DOM.formEdit.reset(); };
      DOM.btnEditCancel.addEventListener('click', closeEdit);
      document.getElementById('backdrop-edit').addEventListener('click', closeEdit);

      DOM.btnLogout.addEventListener('click', () => {
        STATE.isAdmin = false;
        updateSystemUI();
      });

      DOM.btnLoginConfirm.addEventListener('click', () => {
        if (DOM.inputPassword.value === SYSTEM_PASSWORD) {
          STATE.isAdmin = true;
          closeLogin();
          updateSystemUI();
        } else {
          alert("Nesprávné heslo!");
          DOM.inputPassword.value = '';
        }
      });

      DOM.searchInput.addEventListener('input', (e) => {
        STATE.searchQuery = e.target.value.trim();
        renderProducts();
      });

      DOM.filtersWrap.addEventListener('click', (e) => {
        if (e.target.classList.contains('btn-filter')) {
          document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
          e.target.classList.add('active');
          STATE.currentCategory = e.target.getAttribute('data-category');
          renderProducts();
        }
      });

      DOM.productsGrid.addEventListener('click', async (e) => {
        const delBtn = e.target.closest('.js-del-btn');
        if (delBtn) {
          if (!confirm("Opravdu smazat tento produkt z katalogu?")) return;
          const id = delBtn.getAttribute('data-id');
          
          delBtn.innerText = "Mažu..."; delBtn.disabled = true;
          try {
            await deleteDoc(doc(db, "products", id));
            await loadDatabase();
          } catch(err) {
            alert("Chyba při mazání: " + err.message);
          }
          return;
        }

        const editBtn = e.target.closest('.js-edit-btn');
        if (editBtn) {
          const id = editBtn.getAttribute('data-id');
          const productToEdit = STATE.products.find(p => p.id === id);
          
          if(productToEdit) {
            document.getElementById('edit-id').value = productToEdit.id;
            document.getElementById('edit-title').value = productToEdit.title;
            document.getElementById('edit-price').value = productToEdit.price || '';
            document.getElementById('edit-category').value = productToEdit.category;
            document.getElementById('edit-image').value = productToEdit.image_url;
            document.getElementById('edit-desc').value = productToEdit.description;
            
            DOM.modalEdit.classList.remove('hidden');
          }
        }
      });

      DOM.formAdd.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-save-new');
        btn.innerText = "Zpracovávám..."; btn.disabled = true;

        try {
          await addDoc(collection(db, "products"), {
            title: document.getElementById('add-title').value.trim(),
            price: document.getElementById('add-price').value.trim(),
            category: document.getElementById('add-category').value,
            description: document.getElementById('add-desc').value.trim(),
            image_url: document.getElementById('add-image').value.trim(),
            created_at: Date.now()
          });

          DOM.formAdd.reset();
          await loadDatabase();
        } catch (error) {
          alert("Došlo k chybě při přidávání: " + error.message);
        } finally {
          btn.innerText = "Přidat do databáze"; btn.disabled = false;
        }
      });

      DOM.formEdit.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-save-edit');
        btn.innerText = "Zpracovávám..."; btn.disabled = true;

        try {
          const id = document.getElementById('edit-id').value;
          
          const updates = {
            title: document.getElementById('edit-title').value.trim(),
            price: document.getElementById('edit-price').value.trim(),
            category: document.getElementById('edit-category').value,
            description: document.getElementById('edit-desc').value.trim(),
            image_url: document.getElementById('edit-image').value.trim()
          };

          await updateDoc(doc(db, "products", id), updates);
          closeEdit();
          await loadDatabase();
        } catch (error) {
          alert("Došlo k chybě při ukládání: " + error.message);
        } finally {
          btn.innerText = "Uložit změny"; btn.disabled = false;
        }
      });
    }

    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      
      initializeEvents();
      loadDatabase();
    } catch (criticalError) {
      console.error(criticalError);
      DOM.productsGrid.innerHTML = '<div class="status-message" style="color:red;">Kritická chyba: Aplikaci nelze spustit.</div>';
    }
  </script>
</body>
</html>
