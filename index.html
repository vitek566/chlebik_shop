<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clebikshop | Prémiový Katalog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* =========================================
       PROFESIONÁLNÍ DESIGN (CSS PROMĚNNÉ)
       ========================================= */
    :root {
      --font-main: 'Inter', sans-serif;
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border-light: #e2e8f0;
      
      /* Moderní Indigo barva */
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
      --radius-md: 0.75rem;
      --radius-lg: 1rem;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font-main);
      background-color: var(--bg-body);
      color: var(--text-dark);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
    .hidden { display: none !important; }

    /* --- HLAVIČKA --- */
    header {
      position: sticky; top: 0; z-index: 40;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-light);
      padding: 20px 0;
      margin-bottom: 40px;
    }
    
    .header-content { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .logo { font-size: 2rem; font-weight: 800; letter-spacing: -0.025em; color: var(--text-dark); }
    .logo span { color: var(--primary); }

    .toolbar { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center; }
    
    .search-wrapper { position: relative; flex-grow: 1; max-width: 400px; }
    .search-wrapper input {
      width: 100%; padding: 12px 20px;
      background: var(--bg-body); border: 1px solid var(--border-light);
      border-radius: 99px; font-size: 0.95rem; font-family: inherit;
      transition: var(--transition); outline: none;
    }
    .search-wrapper input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); background: #fff; }

    .filters { display: flex; gap: 8px; }
    .btn-filter {
      padding: 8px 20px; border-radius: 99px; font-weight: 500; font-size: 0.9rem;
      background: #fff; border: 1px solid var(--border-light); color: var(--text-muted);
      cursor: pointer; transition: var(--transition);
    }
    .btn-filter:hover { border-color: var(--text-muted); }
    .btn-filter.active { background: var(--text-dark); color: #fff; border-color: var(--text-dark); }

    /* --- TLAČÍTKA --- */
    button { font-family: inherit; cursor: pointer; outline: none; transition: var(--transition); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-auth { background: #fff; border: 1px solid var(--border-light); padding: 10px 20px; border-radius: 99px; font-weight: 600; font-size: 0.9rem; color: var(--text-dark); box-shadow: var(--shadow-sm); }
    .btn-auth:hover { background: var(--bg-body); }
    .btn-primary { background: var(--primary); color: #fff; border: none; padding: 12px 24px; border-radius: var(--radius-md); font-weight: 600; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
    .btn-secondary { background: var(--bg-body); color: var(--text-dark); border: 1px solid var(--border-light); padding: 12px 24px; border-radius: var(--radius-md); font-weight: 600; }
    .btn-secondary:hover { background: #e2e8f0; }

    /* --- ADMIN PANEL --- */
    .admin-panel {
      background: var(--bg-card); padding: 32px; border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md); border: 1px solid var(--border-light);
      margin-bottom: 40px; position: relative; overflow: hidden;
    }
    .admin-panel::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--primary); }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .admin-header h2 { font-size: 1.5rem; font-weight: 700; }
    .btn-logout { background: none; border: none; color: var(--danger); font-weight: 600; font-size: 0.95rem; }
    .btn-logout:hover { text-decoration: underline; }

    /* --- FORMULÁŘE --- */
    .form-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 24px; }
    @media (min-width: 768px) { .form-grid { grid-template-columns: 1fr 1fr; } }
    .input-group { display: flex; flex-direction: column; gap: 8px; }
    .input-group label { font-size: 0.875rem; font-weight: 600; color: var(--text-dark); }
    .input-group input, .input-group select, .input-group textarea {
      width: 100%; padding: 12px 16px; border: 1px solid var(--border-light);
      border-radius: var(--radius-md); background: var(--bg-body); font-size: 0.95rem;
      transition: var(--transition); font-family: inherit; outline: none;
    }
    .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
      border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }
    .file-input { padding: 9px !important; background: #fff !important; cursor: pointer; }

    /* --- KARTY PRODUKTŮ --- */
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 32px; padding-bottom: 80px; }
    .card {
      background: var(--bg-card); border-radius: var(--radius-lg); overflow: hidden;
      box-shadow: var(--shadow-sm); border: 1px solid var(--border-light);
      display: flex; flex-direction: column; transition: var(--transition);
    }
    .card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); }
    
    .card-img-box { position: relative; width: 100%; aspect-ratio: 4/3; background: #f1f5f9; overflow: hidden; }
    .card-img-box img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .card:hover .card-img-box img { transform: scale(1.05); }
    
    .badge {
      position: absolute; top: 16px; left: 16px; background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px); padding: 6px 12px; border-radius: 99px;
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    }
    
    .card-content { padding: 24px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; color: var(--text-dark); }
    .card-desc { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 16px; flex-grow: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .card-price { font-size: 1.5rem; font-weight: 800; color: var(--primary); }

    .card-admin-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 24px 24px; }
    .btn-action { padding: 10px; border-radius: var(--radius-md); font-weight: 600; font-size: 0.9rem; border: none; }
    .btn-edit { background: var(--bg-body); color: var(--text-dark); }
    .btn-edit:hover { background: #e2e8f0; }
    .btn-delete { background: #fef2f2; color: var(--danger); }
    .btn-delete:hover { background: #fee2e2; }

    /* --- MODÁLNÍ OKNA --- */
    .modal { position: fixed; inset: 0; z-index: 100; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .modal-backdrop { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
    .modal-content {
      position: relative; background: var(--bg-card); width: 100%; max-width: 500px;
      padding: 32px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
      animation: modalSlideIn 0.3s ease-out;
    }
    .modal h3 { font-size: 1.5rem; font-weight: 700; margin-bottom: 24px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px; }
    
    @keyframes modalSlideIn {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    
    /* Vylepšený text pro prázdný stav */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 1.1rem; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <header>
    <div class="container">
      <div class="header-content">
        <div class="logo">Clebikshop<span>.</span></div>
        <button id="nav-auth-btn" class="btn-auth">🔐 Prodejce</button>
      </div>

      <div class="toolbar">
        <div class="search-wrapper">
          <input type="text" id="search-input" placeholder="Hledat produkty...">
        </div>
        <div class="filters" id="category-filters">
          <button class="btn-filter active" data-filter="all">Vše</button>
          <button class="btn-filter" data-filter="potraviny">Potraviny</button>
          <button class="btn-filter" data-filter="rybarske">Rybářské potřeby</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    
    <!-- ADMIN PANEL -->
    <section id="admin-panel" class="admin-panel hidden">
      <div class="admin-header">
        <h2>Přidat nový produkt</h2>
        <button id="logout-btn" class="btn-logout">Odhlásit se</button>
      </div>
      
      <form id="add-product-form">
        <div class="form-grid">
          <div class="input-group">
            <label for="prod-title">Název produktu</label>
            <input type="text" id="prod-title" required placeholder="Např. Rybářský prut">
          </div>
          <div class="input-group">
            <label for="prod-price">Cena</label>
            <input type="text" id="prod-price" placeholder="Např. 1200 Kč">
          </div>
          <div class="input-group">
            <label for="prod-category">Kategorie</label>
            <select id="prod-category" required>
              <option value="" disabled selected>Zvolte kategorii...</option>
              <option value="potraviny">Potraviny</option>
              <option value="rybarske">Rybářské potřeby</option>
            </select>
          </div>
          <div class="input-group">
            <label for="prod-image">Fotografie</label>
            <input type="file" id="prod-image" accept="image/*" required class="file-input">
          </div>
        </div>
        <div class="input-group" style="margin-bottom: 24px;">
          <label for="prod-desc">Popis</label>
          <textarea id="prod-desc" rows="3" required placeholder="Napište detaily o produktu..."></textarea>
        </div>
        <button type="submit" id="save-btn" class="btn-primary" style="width: 100%;">Přidat do katalogu</button>
      </form>
    </section>

    <!-- MŘÍŽKA PRODUKTŮ -->
    <div id="products-grid" class="products-grid">
      <div class="empty-state">Načítám katalog...</div>
    </div>

  </main>

  <!-- MODAL: PŘIHLÁŠENÍ -->
  <div id="login-modal" class="modal hidden">
    <div class="modal-backdrop" id="login-backdrop"></div>
    <div class="modal-content">
      <h3>Přístup pro prodejce</h3>
      <div class="input-group">
        <label>Heslo</label>
        <input type="password" id="admin-password" placeholder="Zadejte heslo...">
      </div>
      <div class="modal-actions">
        <button type="button" id="login-cancel-btn" class="btn-secondary">Zrušit</button>
        <button type="button" id="login-confirm-btn" class="btn-primary">Přihlásit se</button>
      </div>
    </div>
  </div>

  <!-- MODAL: ÚPRAVA -->
  <div id="edit-modal" class="modal hidden">
    <div class="modal-backdrop" id="edit-backdrop"></div>
    <div class="modal-content">
      <h3>Úprava produktu</h3>
      <form id="edit-product-form">
        <input type="hidden" id="edit-prod-id">
        <input type="hidden" id="edit-prod-image-path">
        
        <div class="form-grid">
          <div class="input-group"><label>Název</label><input type="text" id="edit-prod-title" required></div>
          <div class="input-group"><label>Cena</label><input type="text" id="edit-prod-price"></div>
          <div class="input-group">
            <label>Kategorie</label>
            <select id="edit-prod-category" required>
              <option value="potraviny">Potraviny</option>
              <option value="rybarske">Rybářské potřeby</option>
            </select>
          </div>
          <div class="input-group"><label>Nová fotka (volitelné)</label><input type="file" id="edit-prod-image" accept="image/*" class="file-input"></div>
        </div>
        <div class="input-group"><label>Popis</label><textarea id="edit-prod-desc" rows="3" required></textarea></div>
        
        <div class="modal-actions">
          <button type="button" id="edit-cancel-btn" class="btn-secondary">Zrušit</button>
          <button type="submit" id="update-btn" class="btn-primary">Uložit změny</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JAVASCRIPT (MODERNÍ EVENT LISTENERS) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

    // --- STAV APLIKACE ---
    const ADMIN_PASSWORD = "chlebakk";
    let isAdmin = false;
    let products = [];
    let currentFilter = 'all';
    let searchQuery = '';

    // --- DOM ELEMENTY ---
    const ui = {
      navAuthBtn: document.getElementById('nav-auth-btn'),
      adminPanel: document.getElementById('admin-panel'),
      logoutBtn: document.getElementById('logout-btn'),
      grid: document.getElementById('products-grid'),
      
      loginModal: document.getElementById('login-modal'),
      loginCancel: document.getElementById('login-cancel-btn'),
      loginConfirm: document.getElementById('login-confirm-btn'),
      loginBackdrop: document.getElementById('login-backdrop'),
      passInput: document.getElementById('admin-password'),
      
      editModal: document.getElementById('edit-modal'),
      editCancel: document.getElementById('edit-cancel-btn'),
      editBackdrop: document.getElementById('edit-backdrop'),
      editForm: document.getElementById('edit-product-form'),
      
      addForm: document.getElementById('add-product-form'),
      searchInput: document.getElementById('search-input'),
      filtersWrap: document.getElementById('category-filters')
    };

    // --- FIREBASE NASTAVENÍ ---
    const firebaseConfig = {
      apiKey: "AIzaSyA2yXEzcYQYsHOoIhARz7uqo3LJSrLVNUs",
      authDomain: "clebikshop.firebaseapp.com",
      projectId: "clebikshop",
      storageBucket: "clebikshop.firebasestorage.app",
      messagingSenderId: "129581121422",
      appId: "1:129581121422:web:a362d35549d02b5a11eedf",
      measurementId: "G-S5J1YKJ28J"
    };

    let db, storage;
    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      storage = getStorage(app);
      loadProducts();
    } catch (e) {
      ui.grid.innerHTML = '<div class="empty-state" style="color:var(--danger)">Chyba připojení k databázi.</div>';
    }

    // --- LOGIKA UI ---
    const updateAuthUI = () => {
      ui.adminPanel.classList.toggle('hidden', !isAdmin);
      ui.navAuthBtn.innerHTML = isAdmin ? '🔓 Odhlásit se' : '🔐 Prodejce';
      renderGrid();
    };

    const closeLogin = () => { ui.loginModal.classList.add('hidden'); ui.passInput.value = ''; };
    const closeEdit = () => { ui.editModal.classList.add('hidden'); ui.editForm.reset(); };

    // --- EVENT LISTENERY (TOTO OPRAVUJE KLIKÁNÍ) ---
    
    // 1. Hlavička - Přihlášení / Odhlášení
    ui.navAuthBtn.addEventListener('click', () => {
      if (isAdmin) { isAdmin = false; updateAuthUI(); } 
      else { ui.loginModal.classList.remove('hidden'); }
    });

    // 2. Modální okna - Zavírání a Potvrzování
    ui.loginCancel.addEventListener('click', closeLogin);
    ui.loginBackdrop.addEventListener('click', closeLogin);
    ui.editCancel.addEventListener('click', closeEdit);
    ui.editBackdrop.addEventListener('click', closeEdit);
    ui.logoutBtn.addEventListener('click', () => { isAdmin = false; updateAuthUI(); });

    ui.loginConfirm.addEventListener('click', () => {
      if (ui.passInput.value === ADMIN_PASSWORD) {
        isAdmin = true;
        closeLogin();
        updateAuthUI();
      } else {
        alert('Špatné heslo!');
        ui.passInput.value = '';
      }
    });

    // 3. Hledání a Filtry
    ui.searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase();
      renderGrid();
    });

    ui.filtersWrap.addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON') {
        document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        renderGrid();
      }
    });

    // 4. Delegování událostí pro tlačítka na kartách produktů (Smazat / Upravit)
    ui.grid.addEventListener('click', async (e) => {
      const editBtn = e.target.closest('.btn-edit');
      const delBtn = e.target.closest('.btn-delete');
      
      if (editBtn) {
        const id = editBtn.dataset.id;
        const p = products.find(x => x.id === id);
        if(p) {
          document.getElementById('edit-prod-id').value = p.id;
          document.getElementById('edit-prod-image-path').value = p.image_path;
          document.getElementById('edit-prod-title').value = p.title;
          document.getElementById('edit-prod-price').value = p.price || '';
          document.getElementById('edit-prod-category').value = p.category;
          document.getElementById('edit-prod-desc').value = p.description;
          ui.editModal.classList.remove('hidden');
        }
      }
      
      if (delBtn) {
        if (!confirm("Opravdu smazat produkt?")) return;
        const id = delBtn.dataset.id;
        const path = delBtn.dataset.path;
        try {
          if (path) await deleteObject(ref(storage, path)).catch(() => {});
          await deleteDoc(doc(db, "products", id));
          await loadProducts();
        } catch(err) { alert("Chyba: " + err.message); }
      }
    });

    // 5. Přidání produktu (Formulář)
    ui.addForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('save-btn');
      btn.innerText = "Ukládám..."; btn.disabled = true;
      try {
        const file = document.getElementById('prod-image').files[0];
        const filePath = `products/${Date.now()}_${file.name}`;
        const fileRef = ref(storage, filePath);
        await uploadBytes(fileRef, file);
        const url = await getDownloadURL(fileRef);

        await addDoc(collection(db, "products"), {
          title: document.getElementById('prod-title').value,
          price: document.getElementById('prod-price').value,
          category: document.getElementById('prod-category').value,
          description: document.getElementById('prod-desc').value,
          image_url: url, image_path: filePath, created_at: Date.now()
        });
        ui.addForm.reset();
        await loadProducts();
      } catch (err) { alert(err.message); }
      finally { btn.innerText = "Přidat do katalogu"; btn.disabled = false; }
    });

    // 6. Úprava produktu (Formulář)
    ui.editForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('update-btn');
      btn.innerText = "Ukládám..."; btn.disabled = true;
      try {
        const id = document.getElementById('edit-prod-id').value;
        let imagePath = document.getElementById('edit-prod-image-path').value;
        const newFile = document.getElementById('edit-prod-image').files[0];
        
        const updates = {
          title: document.getElementById('edit-prod-title').value,
          price: document.getElementById('edit-prod-price').value,
          category: document.getElementById('edit-prod-category').value,
          description: document.getElementById('edit-prod-desc').value
        };

        if (newFile) {
          if (imagePath) await deleteObject(ref(storage, imagePath)).catch(()=>console.log("stará fotka nenalezena"));
          imagePath = `products/${Date.now()}_${newFile.name}`;
          const fileRef = ref(storage, imagePath);
          await uploadBytes(fileRef, newFile);
          updates.image_url = await getDownloadURL(fileRef);
          updates.image_path = imagePath;
        }

        await updateDoc(doc(db, "products", id), updates);
        closeEdit();
        await loadProducts();
      } catch (err) { alert(err.message); }
      finally { btn.innerText = "Uložit změny"; btn.disabled = false; }
    });

    // --- NARozumím, to zamrzí, když to pořád nefunguje tak, jak má. Rád se na to podívám a pomůžu ti to dotáhnout do konce, včetně vyladěného a profesionálního designu.
